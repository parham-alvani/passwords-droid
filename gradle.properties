org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Toolchain: AGP 9.4.0 requires JDK 17. Homebrew also ships JDK 26, which Gradle
# would otherwise auto-select for the daemon, and AGP rejects it with an
# unhelpful error. The foojay resolver in settings.gradle.kts provisions 17.
org.gradle.java.installations.auto-detect=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
