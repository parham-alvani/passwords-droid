---
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish a signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6

      # A tag that disagrees with versionName publishes a release whose APK
      # says it is something else.
      - name: The tag and the declared version must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME declares $tag but app/build.gradle.kts says $declared."
            echo "::error::run 'just bump $tag', commit, then move the tag."
            exit 1
          fi

      # Nothing gets published from a tree that would not pass an ordinary push.
      - name: Format, lint and tests
        run: ./gradlew ktlintCheck test lintRelease

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. The build would fall back to the debug key,"
            echo "::error::which cannot be updated in place later. Refusing to publish."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          PASSWORDS_KEYSTORE: ${{ runner.temp }}/release.jks
          PASSWORDS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PASSWORDS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PASSWORDS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # R8 only runs on release builds, so this is the only place the check
      # can happen -- and an APK that fails it looks perfectly healthy until
      # someone tries to sync.
      - name: The SSH transport's reflective classes survived R8
        run: ./tools/verify-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Collect the artifact and its fingerprint
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="passwords-$version.apk"
          mv app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"

          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          fingerprint=$("$apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)

          # A debug-signed release is the one mistake that cannot be undone
          # without making every installed copy un-updatable, so it is checked
          # after the fact rather than assumed from the build succeeding.
          if [ -z "$fingerprint" ]; then
            echo "::error::could not read a signing certificate from $apk"
            exit 1
          fi

          {
            echo "APK=$apk"
            echo "FINGERPRINT=$fingerprint"
          } >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Install by downloading \`$APK\` and opening it on the device. Android
          will ask you to allow installs from your browser or file manager the
          first time.

          An update only installs over an existing copy if it was signed with
          the same key, so check the fingerprint matches the one on the release
          you installed last:

          \`\`\`text
          $FINGERPRINT
          \`\`\`

          \`\`\`bash
          apksigner verify --print-certs $APK
          sha256sum -c $APK.sha256
          \`\`\`
          EOF

          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
